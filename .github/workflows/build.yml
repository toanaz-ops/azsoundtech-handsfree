name: Build

on:
  pull_request:
    branches: [ main, develop ]
    # Docs-only changes never touch the C++ build -- skip for them.
    # NOTE: if this later becomes a REQUIRED check under branch protection, a
    # docs-only PR will sit with the check "expected" and block merge. Handle it
    # then with a companion always-green job, not by deleting these filters.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'memory/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    # macOS là cross-build smoke check (hệ số 10x phút) -> chạy 1 lần/tuần,
    # thứ Hai 08:00 giờ VN = 01:00 UTC. Chỉ job `macos` đọc lịch này.
    - cron: '0 1 * * 1'
    # Sanitizers: hằng đêm 02:30 giờ VN = 19:30 UTC, trên main. Chỉ job
    # `linux-sanitizers` đọc lịch này (so theo github.event.schedule).
    - cron: '30 19 * * *'

# One run per ref. A PR pushed three times in ten minutes used to leave three
# matrix builds racing; the stale ones told nobody anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# --- MỨC CI: B, có van hạ về A ---------------------------------------------
# Mặc định (B): Windows chạy MỌI pull_request; macOS chỉ weekly + bấm tay.
# Van hạ về A khi vướng/sắp vướng quota -- đặt biến repo CI_HEAVY=off:
#     gh variable set CI_HEAVY -R toanaz-ops/azsoundtech-handsfree -b off
#   -> PR-Windows và macOS-weekly đều DỪNG; chỉ còn workflow_dispatch (bấm tay).
# Bật lại B:  gh variable set CI_HEAVY -b on   (hoặc xoá biến -- unset = B).
# Gate cứng thật nằm ở máy dev (.githooks); CI ở đây là ĐÈN BÁO.

jobs:
  # Bản Windows LÀ sản phẩm thật (JUCE_ASIO chỉ compile trên Windows) -> mọi PR,
  # và luôn chạy khi bấm tay. Hạ về A (CI_HEAVY=off) thì PR không chạy job này.
  windows:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && vars.CI_HEAVY != 'off')
    runs-on: windows-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Generator KHÔNG pin. 2026-08-22 lần chạy đầu fail 27s "could not find any
      # instance of Visual Studio": windows-latest đã nhảy sang image có VS 2026,
      # VS 2022 không còn trên box. Không -G -> CMake tự chọn VS mới nhất nên image
      # bump sau không phá build. -A x64 vẫn hợp lệ vì generator tự chọn là VS
      # generator. ĐỪNG pin lại về số phiên bản.
      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest -C Release --output-on-failure

  # macOS: KHÔNG có ASIO -> chỉ smoke check "còn build được trên clang không".
  # Hệ số 10x nên KHÔNG chạy mỗi PR: chỉ weekly (trừ khi hạ về A) và khi bấm tay.
  macos:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1'
       && vars.CI_HEAVY != 'off')
    runs-on: macos-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest -C Release --output-on-failure

  # Linux + AddressSanitizer/UBSan (review 2026-10-20, M5). Not the product --
  # no ASIO -- but the only place a use-after-free or a data-race-shaped
  # lifetime bug gets caught before the PA does: ASan on Linux found the lane M
  # `Rig` fixture's use-after-free (memory/lane-u-dumb-geek-2026-10-18.md) that
  # every MSVC Release run had passed. GCC, because the stock Ubuntu clang here
  # has been seen without its ASan runtime. Same CI_HEAVY valve as Windows;
  # ubuntu runners are the cheap ones (1x).
  #
  # NIGHTLY, not per PR (owner 2026-10-22: "có cần chạy nhiều CI như vậy
  # không"). It takes ~15 min and finds lifetime bugs, which do not need to
  # be caught on the same push that introduced them -- the next morning is
  # early enough, and a PR that needs it can still be run by hand
  # (workflow_dispatch on its branch).
  linux-sanitizers:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '30 19 * * *'
       && vars.CI_HEAVY != 'off')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libxi-dev libxcomposite-dev libxrender-dev libgl1-mesa-dev

      - name: Configure CMake (GCC, ASan + UBSan)
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build --target HandsFreeTests -j 4

      - name: Run tests under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # -j 2, not more: SoundcheckController.AbortAndJoinJoinsBeforeItRuns
        # drives the real poll thread against wall time, and under ASan with
        # eight jobs on the box it missed its window (it passes alone, and the
        # whole suite passes at -j 2: 795/795, 136 s, 2026-10-20).
        run: |
          cd build
          ctest --output-on-failure -j 2

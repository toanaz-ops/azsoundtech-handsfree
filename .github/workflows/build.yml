name: Build

on:
  pull_request:
    branches: [ main, develop ]
    # Docs-only changes never touch the C++ build -- skip the matrix for them.
    # NOTE: if this later becomes a REQUIRED check under branch protection, a
    # docs-only PR will sit with the check "expected" and block merge. Handle it
    # then with a companion always-green job, not by deleting these filters.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'memory/**'
      - 'LICENSE'
      - '.gitignore'
  # Post-merge verification is on-demand now, instead of an automatic SECOND
  # matrix on every push to main: the PR already built the same squashed content.
  workflow_dispatch:

# One run per branch. A PR that gets three pushes in ten minutes used to leave
# three 25-minute matrix builds racing, and the stale ones told nobody anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # The generator is deliberately NOT pinned.
    #
    # This step used to say -G "Visual Studio 17 2022". On 2026-08-22, the first
    # time this workflow ever ran, it failed in 27 seconds with "could not find
    # any instance of Visual Studio": windows-latest had moved to image
    # windows-2025-vs2026, which ships Visual Studio 2026, and VS 2022 is simply
    # not on the box any more.
    #
    # With no -G, CMake selects the newest Visual Studio it finds, so the next
    # image bump does not break the build again. -A x64 still applies -- the
    # auto-selected generator on a Windows image with VS installed IS a Visual
    # Studio generator, which is what makes the platform flag valid.
    #
    # Do not re-pin this to a version number.
    # Windows: -A x64 applies because the auto-selected generator is a Visual
    # Studio generator. macOS: plain configure, no ASIO SDK -- JUCE_ASIO
    # compiles only on Windows, so nothing external is needed there.
    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      run: cmake -B build -A x64

    - name: Configure CMake (macOS)
      if: matrix.os == 'macos-latest'
      run: cmake -B build

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: |
        cd build
        ctest -C Release --output-on-failure
